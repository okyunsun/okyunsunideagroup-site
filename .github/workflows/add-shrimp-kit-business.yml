name: Add shrimp salt-grill kit as major business

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-shrimp-kit-business.yml

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage
        run: python .github/scripts/add_shrimp_business.py
      - name: Commit changes
        run: |
          git config user.name "OKYUNSUN Site Updater"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/add-shrimp-kit-business.yml .github/scripts/add_shrimp_business.py
          git add index.html
          git commit -m "Add shrimp salt-grill kit as major business"
          git push origin HEAD:main
