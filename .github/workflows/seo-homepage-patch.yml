name: SEO homepage patch

on:
  push:
    paths:
      - '.github/workflows/seo-homepage-patch.yml'

permissions:
  contents: write

jobs:
  patch-homepage-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_title = '<title>OKYUNSUN IDEA GROUP | Specializing in global product planning, IP, BM, and content solutions.</title>'
          new_title = '<title>옥윤선아이디어그룹 | IP·BM·제품기획 사업화 파트너</title>'
          if old_title in s:
              s = s.replace(old_title, new_title, 1)

          old_desc = '<meta name="description" content="OKYUNSUN IDEA GROUP is an external innovation partner that connects product planning, IP, BM, and content into a practical commercialization structure."/>'
          new_desc = '<meta name="description" content="옥윤선아이디어그룹(OKYUNSUN IDEA GROUP)은 제품기획, IP, 비즈니스모델(BM), 기업 협업과 라이선스·로열티 구조를 연결해 아이디어와 기술의 사업화를 추진하는 외부혁신 파트너입니다."/>'
          if old_desc in s:
              s = s.replace(old_desc, new_desc, 1)

          marker = new_desc
          if '<link rel="canonical" href="https://www.okyunsunideagroup.com/"' not in s:
              schema = {
                  "@context": "https://schema.org",
                  "@graph": [
                      {
                          "@type": "Organization",
                          "@id": "https://www.okyunsunideagroup.com/#organization",
                          "name": "OKYUNSUN IDEA GROUP",
                          "alternateName": "옥윤선아이디어그룹",
                          "url": "https://www.okyunsunideagroup.com/",
                          "description": "제품기획, IP, 비즈니스모델(BM), 기업 협업과 라이선스·로열티 구조를 연결하는 IP 기반 사업화 및 외부혁신 파트너"
                      },
                      {
                          "@type": "WebSite",
                          "@id": "https://www.okyunsunideagroup.com/#website",
                          "url": "https://www.okyunsunideagroup.com/",
                          "name": "OKYUNSUN IDEA GROUP",
                          "alternateName": "옥윤선아이디어그룹",
                          "publisher": {"@id": "https://www.okyunsunideagroup.com/#organization"},
                          "inLanguage": ["ko", "en"]
                      }
                  ]
              }
              seo = '''
          <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"/>
          <link rel="canonical" href="https://www.okyunsunideagroup.com/"/>
          <meta property="og:type" content="website"/>
          <meta property="og:locale" content="ko_KR"/>
          <meta property="og:site_name" content="OKYUNSUN IDEA GROUP"/>
          <meta property="og:title" content="옥윤선아이디어그룹 | IP·BM·제품기획 사업화 파트너"/>
          <meta property="og:description" content="아이디어·기술·IP를 기업 협업, 라이선스·로열티와 실제 사업화로 연결하는 외부혁신 파트너."/>
          <meta property="og:url" content="https://www.okyunsunideagroup.com/"/>
          <meta name="twitter:card" content="summary"/>
          <meta name="twitter:title" content="옥윤선아이디어그룹 | IP·BM·제품기획 사업화 파트너"/>
          <meta name="twitter:description" content="IP·BM·제품기획을 기업 협업과 실제 사업화로 연결합니다."/>
          <script type="application/ld+json">''' + json.dumps(schema, ensure_ascii=False, separators=(',', ':')) + '''</script>'''
              if marker in s:
                  s = s.replace(marker, marker + seo, 1)
              else:
                  s = s.replace('</head>', seo + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage SEO changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No SEO changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve homepage SEO metadata"
          git push
