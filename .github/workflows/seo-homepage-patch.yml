name: SEO homepage patch

on:
  push:
    paths:
      - '.github/workflows/seo-homepage-patch.yml'

permissions:
  contents: write

jobs:
  patch-homepage-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage metadata and internal links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          title = '<title>옥윤선아이디어그룹 | IP·BM·제품기획 사업화 파트너</title>'
          desc = '<meta name="description" content="옥윤선아이디어그룹은 제품기획·IP·BM·기업협업을 연결해 아이디어와 기술의 사업화를 추진하는 외부혁신 파트너입니다."/>'

          s = re.sub(r'<title>.*?</title>', title, s, count=1, flags=re.I | re.S)
          s = re.sub(r'<meta\b(?=[^>]*\bname=["\']description["\'])[^>]*>', desc, s, count=1, flags=re.I | re.S)

          if '<link rel="canonical" href="https://www.okyunsunideagroup.com/"' not in s:
              schema = {
                  "@context": "https://schema.org",
                  "@graph": [
                      {
                          "@type": "Organization",
                          "@id": "https://www.okyunsunideagroup.com/#organization",
                          "name": "OKYUNSUN IDEA GROUP",
                          "alternateName": "옥윤선아이디어그룹",
                          "url": "https://www.okyunsunideagroup.com/",
                          "description": "제품기획, IP, 비즈니스모델(BM), 기업 협업과 라이선스·로열티 구조를 연결하는 IP 기반 사업화 및 외부혁신 파트너"
                      },
                      {
                          "@type": "WebSite",
                          "@id": "https://www.okyunsunideagroup.com/#website",
                          "url": "https://www.okyunsunideagroup.com/",
                          "name": "OKYUNSUN IDEA GROUP",
                          "alternateName": "옥윤선아이디어그룹",
                          "publisher": {"@id": "https://www.okyunsunideagroup.com/#organization"},
                          "inLanguage": ["ko", "en"]
                      }
                  ]
              }
              seo = '''
          <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"/>
          <link rel="canonical" href="https://www.okyunsunideagroup.com/"/>
          <meta property="og:type" content="website"/>
          <meta property="og:locale" content="ko_KR"/>
          <meta property="og:site_name" content="OKYUNSUN IDEA GROUP"/>
          <meta property="og:title" content="옥윤선아이디어그룹 | IP·BM·제품기획 사업화 파트너"/>
          <meta property="og:description" content="아이디어·기술·IP를 기업 협업, 라이선스·로열티와 실제 사업화로 연결하는 외부혁신 파트너."/>
          <meta property="og:url" content="https://www.okyunsunideagroup.com/"/>
          <meta name="twitter:card" content="summary"/>
          <meta name="twitter:title" content="옥윤선아이디어그룹 | IP·BM·제품기획 사업화 파트너"/>
          <meta name="twitter:description" content="IP·BM·제품기획을 기업 협업과 실제 사업화로 연결합니다."/>
          <script type="application/ld+json">''' + json.dumps(schema, ensure_ascii=False, separators=(',', ':')) + '''</script>'''
              s = s.replace(desc, desc + seo, 1) if desc in s else s.replace('</head>', seo + '\n</head>', 1)

          if 'id="seo-discovery-links"' not in s:
              links = '''
          <section id="seo-discovery-links" aria-label="주요 사업화 프로젝트" style="max-width:1180px;margin:48px auto 0;padding:28px 24px 36px;border-top:1px solid rgba(127,127,127,.28);font-family:Arial,'Noto Sans KR',sans-serif;">
            <div style="font-size:13px;letter-spacing:.08em;opacity:.68;margin-bottom:14px;">MAJOR PROJECTS · OKYUNSUN IDEA GROUP</div>
            <div style="display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px;line-height:1.7;">
              <a href="/business" style="color:inherit;text-decoration:underline;text-underline-offset:3px;">IP·BM 사업화</a>
              <a href="/sectors" style="color:inherit;text-decoration:underline;text-underline-offset:3px;">사업 분야</a>
              <a href="/trust-road" style="color:inherit;text-decoration:underline;text-underline-offset:3px;">Trust Road</a>
              <a href="/cup-ice" style="color:inherit;text-decoration:underline;text-underline-offset:3px;">이중구조 컵얼음</a>
              <a href="/corner-ad-banner" style="color:inherit;text-decoration:underline;text-underline-offset:3px;">코너 광고 배너</a>
              <a href="/shrimp-grill-kit" style="color:inherit;text-decoration:underline;text-underline-offset:3px;">새우 소금구이 키트</a>
              <a href="/mw-extraction" style="color:inherit;text-decoration:underline;text-underline-offset:3px;">무가수 MW 추출</a>
            </div>
          </section>
          '''
              s = s.replace('</body>', links + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage SEO changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No SEO changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve homepage SEO metadata and internal links"
          git push
