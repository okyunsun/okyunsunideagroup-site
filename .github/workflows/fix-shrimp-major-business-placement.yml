name: Fix shrimp major business placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shrimp-major-business-placement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install image decoder
        shell: bash
        run: python -m pip install --quiet pillow

      - name: Repair shrimp image into a real asset file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          import io
          import re

          page = Path('index.html')
          s = page.read_text(encoding='utf-8')

          card_start = s.find('class="venture shrimpMajorCard"')
          if card_start == -1:
              raise SystemExit('Could not find shrimp major-business card')

          pill_pos = s.find('<div class="pillrow">', card_start)
          if pill_pos == -1:
              raise SystemExit('Could not find shrimp card pill row')

          visual_start = s.find('<div class="shrimpMajorVisual"', card_start, pill_pos)
          if visual_start == -1:
              raise SystemExit('Could not find current shrimp visual')

          visual_end = s.find('</div>', visual_start, pill_pos)
          if visual_end == -1:
              raise SystemExit('Could not find end of current shrimp visual')
          visual_end += len('</div>')

          visual_html = s[visual_start:visual_end]
          m = re.search(r'src="data:image/webp;base64,([A-Za-z0-9+/=]+)"', visual_html)
          if not m:
              raise SystemExit('Current shrimp visual is not an inline WebP data URI')

          raw = base64.b64decode(m.group(1), validate=True)
          print(f'Inline image bytes: {len(raw)}')

          try:
              im = Image.open(io.BytesIO(raw))
              im.load()
          except Exception as exc:
              raise SystemExit(f'Inline WebP cannot be decoded: {exc}')

          print(f'Decoded image: format={im.format}, size={im.size}, mode={im.mode}')
          if im.width < 500 or im.height < 300:
              raise SystemExit(f'Unexpectedly small shrimp image: {im.size}')

          out = Path('assets/shrimp-salt-grill-kit-final.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          clean = im.convert('RGB')
          clean.save(out, 'WEBP', quality=92, method=6)

          check = Image.open(out)
          check.load()
          print(f'Re-encoded asset: size={check.size}, bytes={out.stat().st_size}')

          replacement = '''<div class="shrimpMajorVisual" style="margin:18px 0 16px">
                <a href="assets/shrimp-salt-grill-kit-final.webp?v=20261010-2" target="_blank" rel="noopener" aria-label="새우 소금구이 키트 최종 구조 이미지 크게 보기">
                  <img src="assets/shrimp-salt-grill-kit-final.webp?v=20261010-2" alt="새우 소금구이 키트 최종 구조 인포그래픽" loading="eager" decoding="async" style="display:block;width:100%;height:auto;border-radius:14px;background:#fff;border:1px solid rgba(148,163,184,.22)">
                </a>
              </div>'''

          s = s[:visual_start] + replacement + s[visual_end:]
          page.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired homepage asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/shrimp-salt-grill-kit-final.webp
          if git diff --cached --quiet; then
            echo "No homepage changes required"
            exit 0
          fi
          git commit -m "Repair shrimp kit homepage image asset"
          git push
