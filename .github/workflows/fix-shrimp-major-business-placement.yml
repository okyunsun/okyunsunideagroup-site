name: Fix shrimp major business placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shrimp-major-business-placement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install image decoder
        shell: bash
        run: python -m pip install --quiet pillow

      - name: Verify high-resolution shrimp image and refresh cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          asset = Path('assets/shrimp-salt-grill-kit-final.webp')
          if not asset.exists():
              raise SystemExit('High-resolution shrimp image asset is missing')

          raw = asset.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected = 'c2373efc6358220e776672f33b222fea82ce3ecd35b7507548289ee785bf9b73'
          if digest != expected:
              raise SystemExit(f'Unexpected shrimp image hash: {digest}')

          im = Image.open(asset)
          im.load()
          if im.format != 'WEBP' or im.size != (1280, 960):
              raise SystemExit(f'Unexpected shrimp image: format={im.format}, size={im.size}')

          page = Path('index.html')
          s = page.read_text(encoding='utf-8')
          old = 'assets/shrimp-salt-grill-kit-final.webp?v=20261010-2'
          new = 'assets/shrimp-salt-grill-kit-final.webp?v=20261010-hq1'

          if old in s:
              s = s.replace(old, new)
              page.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Shrimp homepage image reference was not found')

          print(f'Verified high-resolution shrimp image: {im.size}, {len(raw)} bytes, sha256={digest}')
          PY

      - name: Commit cache refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage cache changes required"
            exit 0
          fi
          git commit -m "Refresh shrimp kit homepage image cache"
          git push
